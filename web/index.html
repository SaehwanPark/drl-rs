<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>DRL-Rust — browser slice</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #111827; color: #e5e7eb; }
      main { max-width: 960px; margin: 0 auto; padding: 1rem; }
      canvas { display: block; width: 100%; max-height: 70vh; image-rendering: pixelated; background: #05070d; }
      button { min-height: 2.5rem; margin: .25rem; padding: .5rem .8rem; }
      #game-status, #game-log { min-height: 1.5rem; }
      .hud { display: flex; gap: 1rem; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>DRL-Rust browser slice</h1>
      <p id="game-status" role="status" aria-live="polite">Press Start to enable graphics and audio.</p>
      <button id="start-button" type="button">Start game</button>
      <button id="restart-button" type="button">Restart</button>
      <button id="save-button" type="button">Save</button>
      <button id="load-button" type="button">Load</button>
      <button id="clear-save-button" type="button">Clear save</button>
      <button id="mute-button" type="button" aria-pressed="false">Mute</button>
      <label for="volume-control">Volume
        <input id="volume-control" type="range" min="0" max="1" step="0.05" value="0.65" />
      </label>
      <section class="hud" aria-label="Game HUD">
        <span id="game-hp">HP: —</span>
        <span id="game-turn">Turn: —</span>
        <span id="game-weapon">Weapon: —</span>
        <span id="target-indicator">Targets: —</span>
      </section>
      <canvas id="game-canvas" tabindex="0" aria-label="DRL-Rust dungeon board"></canvas>
      <p id="game-log" role="log" aria-live="polite">Keyboard: arrows/WASD/numpad move (7/9/1/3 diagonals); G pickup; R reload; F select target; Enter fire; Escape cancel; &gt; descend.</p>
      <details>
        <summary>Inventory</summary>
        <div id="inventory" aria-label="Inventory actions"></div>
      </details>
    </main>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
