[package]
name = "drl-desktop"
description = "Thin native winit and wgpu frontend boundary for drl-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "drl-desktop"
path = "src/main.rs"

[dependencies]
drl-core = { workspace = true }
drl-protocol = { workspace = true }
drl-render = { workspace = true }
pollster = "=0.4.0"
wgpu = { version = "=30.0.0", default-features = false, features = [
  "std",
  "vulkan",
  "metal",
  "wgsl",
] }
winit = { version = "=0.30.12", default-features = true }
