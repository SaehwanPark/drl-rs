[package]
name = "drl-web"
description = "Browser-first WASM session and WebGPU shell for DRL-Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drl-audio = { workspace = true }
drl-assets = { workspace = true }
drl-core = { workspace = true }
drl-protocol = { workspace = true }
drl-render = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "KeyboardEvent",
  "Node",
  "Storage",
  "Window",
] }
wgpu = { version = "=30.0.0", default-features = false, features = ["webgpu", "wgsl"] }
winit = { version = "=0.30.12", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "=0.3.77"
