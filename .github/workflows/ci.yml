name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default stable
      - name: Run repository checks
        env:
          DRL_VERSION_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: sh scripts/check-repository.sh

  web:
    name: WASM browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack 0.15.0
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run web checks and headless Chrome tests
        run: sh scripts/check-web.sh
      - name: Build release bundle
        run: sh scripts/build-web.sh
      - name: Verify release manifest
        run: sh scripts/check-release-manifest.sh
      - name: Verify release rights boundary
        run: sh scripts/check-release-rights.sh
      - name: Verify signed release manifest with ephemeral CI key
        env:
          RELEASE_SIGNING_KEY: ${{ runner.temp }}/drl-release-signing-key.pem
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RELEASE_SIGNING_KEY"
          RELEASE_SIGNING_KEY="$RELEASE_SIGNING_KEY" sh scripts/build-web.sh
          test -s dist/release-manifest.sig
          test -s dist/release-manifest.pub
          test ! -e "dist/$(basename "$RELEASE_SIGNING_KEY")"
          RELEASE_VERIFY_KEY="$PWD/dist/release-manifest.pub" \
            sh scripts/check-release-manifest.sh
          sh scripts/check-release-rights.sh
